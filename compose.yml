name: saaristolautat

services:
  production:
    build:
      context: .
      args:
        APP_ENV: production
        UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-https://cloud.umami.is/script.js}
        UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-6d0b3cd2-13e7-4bb4-9bb0-99b9e57ad936}
    image: saaristolautat-site:production
    restart: unless-stopped
    volumes:
      - ${SAARISTODATA_PATH:-../saaristodata}:/srv/saaristodata:ro
      - live-data:/srv/live:ro
    networks:
      - web

  test:
    build:
      context: .
      args:
        APP_ENV: test
        UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-https://cloud.umami.is/script.js}
        UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-6d0b3cd2-13e7-4bb4-9bb0-99b9e57ad936}
    image: saaristolautat-site:test
    restart: unless-stopped
    volumes:
      - ${SAARISTODATA_PATH:-../saaristodata}:/srv/saaristodata:ro
      - live-data:/srv/live:ro
    networks:
      - web

  liveupdate:
    build:
      context: .
      dockerfile: docker/liveupdate.Dockerfile
    image: saaristolautat-liveupdate:latest
    restart: unless-stopped
    environment:
      LIVE_OUTPUT_DIR: /var/lib/saaristolautat/live
      LIVE_DATABASE: /var/lib/saaristolautat/live/lauttalive.db
      LIVE_POLL_SECONDS: ${LIVE_POLL_SECONDS:-20}
    volumes:
      - live-data:/var/lib/saaristolautat/live
    networks:
      - web

volumes:
  live-data:

networks:
  web:

