<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aikataulu – Saaristolautat</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #fff; }
      img { position: absolute; max-width: 100%; max-height: 100%; inset: 0; }
      button { position: absolute; right: 5px; top: 5px; width: 40px; height: 40px; font-size: 30px; }
    </style>
  </head>
  <body>
    <img id="timetable" alt="Aikataulu">
    <button type="button" onclick="window.close()" aria-label="Sulje">×</button>
    <script>
      const image = new URLSearchParams(location.search).get('t') || '';
      if (/^[^/\\]+\.(?:jpe?g|png)$/i.test(image)) {
        document.querySelector('#timetable').src = `/data/timetables_jpg/${encodeURIComponent(image)}`;
      } else {
        document.querySelector('#timetable').remove();
      }
    </script>
  </body>
</html>
